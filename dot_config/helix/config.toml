theme = "carbonfox"

[editor]
line-number = "relative"
color-modes = true
cursorline = true
bufferline = "always"
scrolloff = 10
preview-completion-insert = false
popup-border = "all"
jump-label-alphabet = "mcnvtowieurhgalskdjf"
end-of-line-diagnostics = "hint"
text-width = 100
completion-replace = true
continue-comments = false
default-yank-register = "+"
trim-trailing-whitespace = true
trim-final-newlines = true

[editor.auto-save]
focus-lost = true
after-delay.enable = true

[editor.indent-guides]
render = true
skip-levels = 1

[editor.inline-diagnostics]
cursor-line = "hint"

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
left = ["mode", "separator", "version-control"]
center = ["file-name", "read-only-indicator", "file-modification-indicator"]
right = [
  "diagnostics",
  "position",
  "file-type",
  "register",
  "selections",
  "spinner",
]
separator = " "
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.whitespace.render]
tab = "all"
nbsp = "all"
nnbsp = "all"

[editor.lsp]
display-progress-messages = true
display-inlay-hints = true
